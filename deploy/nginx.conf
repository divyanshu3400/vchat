# Inside the app server (10.10.11.6). The edge nginx on 10.10.11.4 ends TLS and calls this
# over the private network; nothing else may (Docker's published ports skip ufw).
#   /ws/      -> backend (WebSockets: chat rooms and the personal socket)
#   /api/     -> backend
#   /admin/   -> backend (moderator panel)
#   /static/  -> admin CSS/JS, collected by the migrate service
#   anything else -> web (Next.js)

# The edge overwrites X-Forwarded-For with the visitor's address; take it from there only.
set_real_ip_from 10.10.11.4;
real_ip_header X-Forwarded-For;

# Containers get new addresses when rebuilt; ask Docker's DNS on each request.
resolver 127.0.0.11 valid=10s ipv6=off;

# Upgrade to a WebSocket when the client asks; otherwise a normal request.
map $http_upgrade $vchat_connection {
    default upgrade;
    ""      close;
}

client_max_body_size 1m;

# Set once here: a location that sets any proxy_set_header would drop all of these.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
# The visitor came over TLS to the edge; this hop is plain HTTP.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vchat_connection;

server {
    listen 80 default_server;
    server_name _;

    if ($realip_remote_addr != "10.10.11.4") {
        return 403;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        # Clients ping every 25 s; an hour of silence means the socket is dead.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location / {
        set $web http://web:3000;
        proxy_pass $web;
        proxy_read_timeout 60s;
    }
}
