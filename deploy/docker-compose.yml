# vChat on the app server (10.10.11.6), behind the edge nginx on 10.10.11.4, which holds TLS.
# Everything runs here in Docker. From this folder, with .env made by make_env.sh:
#   docker compose up -d --build
# Relative paths are from deploy/.

name: vchat

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  image: vchat-backend
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vchat
      POSTGRES_USER: vchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${PGDATA_PATH:-/srv/vchat/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vchat", "-d", "vchat"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  # Channel layer (fan-out between workers), presence, rate limits and cache. Nothing in it
  # needs to survive a restart, so it is not saved to disk. Only keys with a TTL are evicted.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  # One-off on every `up`: migrations, default rooms, admin CSS/JS for nginx. Safe to repeat.
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_rooms && python manage.py collectstatic --noinput"
    volumes:
      - static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *backend
    environment:
      MEDIA_ROOT: /app/media
    volumes:
      # Photos, videos and voice notes. A named volume keeps the container user's ownership
      # without sudo on the host; backup.sh archives it.
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'localhost'}), timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL in .env}
        # off until an ad network approves the site; "placeholder" shows the reserved boxes.
        NEXT_PUBLIC_ADS_MODE: ${ADS_MODE:-off}
        NEXT_PUBLIC_ADBLOCK_WALL: ${ADBLOCK_WALL:-off}
    image: vchat-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # Plain HTTP, published only on the private address. Only the edge (10.10.11.4) is
  # answered; see nginx/default.conf. Docker's published ports skip ufw, so both guards matter.
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-10.10.11.6}:${HTTP_PORT:-8081}:80"
    volumes:
      # The folder, not the single file: git replaces files on pull, and a single-file bind
      # mount keeps showing the container the old one. With the folder, a reload is enough:
      #   docker compose exec nginx nginx -s reload
      - ./nginx:/etc/nginx/conf.d:ro
      - static:/srv/static:ro
    depends_on:
      - backend
      - web

  # TURN relay for calls (coturn). Relays audio/video when two phones can't connect directly
  # (mobile carriers, office Wi-Fi). Off until the public ports are forwarded; then:
  #   docker compose --profile turn up -d turn
  # Needs: UDP+TCP 3478 and UDP 49160-49200 forwarded from TURN_PUBLIC_IP to 10.10.11.6,
  # and allowed in ufw (host networking is not covered by Docker's port rules).
  turn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-ip=${BIND_ADDR:-10.10.11.6}
      - --relay-ip=${BIND_ADDR:-10.10.11.6}
      # Reached through the edge on 443 (turns:turn.vchat.ssmm.online), so relay addresses stay on
      # this server: two relayed callers meet here. Only if UDP 3478/49160-49200 get forwarded from
      # the public IP, set TURN_EXTERNAL_IP=<public ip>/10.10.11.6 in .env.
      - --external-ip=${TURN_EXTERNAL_IP:-${BIND_ADDR:-10.10.11.6}}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=vchat.ssmm.online
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-software-attribute
      - --stale-nonce=600
      - --user-quota=10
      - --total-quota=400
      # Never relay into private networks (stops the relay being used to reach the LAN),
      # except this server itself, for two relayed callers meeting here.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --allowed-peer-ip=${BIND_ADDR:-10.10.11.6}
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  static:
  media:
