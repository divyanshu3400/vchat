# vChat on the app server (10.10.11.6), behind the edge nginx on 10.10.11.4, which holds TLS.
# Everything runs here in Docker. From this folder, with .env made by make_env.sh:
#   docker compose up -d --build
# Relative paths are from deploy/.

name: vchat

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  image: vchat-backend
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vchat
      POSTGRES_USER: vchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${PGDATA_PATH:-/srv/vchat/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vchat", "-d", "vchat"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  # Channel layer (fan-out between workers), presence, rate limits and cache. Nothing in it
  # needs to survive a restart, so it is not saved to disk. Only keys with a TTL are evicted.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  # One-off on every `up`: migrations, default rooms, admin CSS/JS for nginx. Safe to repeat.
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_rooms && python manage.py collectstatic --noinput"
    volumes:
      - static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'localhost'}), timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL in .env}
        # off until an ad network approves the site; "placeholder" shows the reserved boxes.
        NEXT_PUBLIC_ADS_MODE: ${ADS_MODE:-off}
        NEXT_PUBLIC_ADBLOCK_WALL: ${ADBLOCK_WALL:-off}
    image: vchat-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # Plain HTTP, published only on the private address. Only the edge (10.10.11.4) is
  # answered; see nginx.conf. Docker's published ports skip ufw, so both guards matter.
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-10.10.11.6}:${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
    depends_on:
      - backend
      - web

volumes:
  static:
