# /etc/nginx/sites-available/vchat on 10.10.11.4 (the edge). Ends TLS for the site and the API
# and passes both to the app server, 10.10.11.6:8081, whose own nginx tells them apart by host
# name. One certificate covers both names. VCHAT_HOST and VCHAT_API_HOST are filled in by
# setup_edge.sh (vchat.ssmm.online and api.vchat.ssmm.online).
# The port 80 server must stay first: setup_edge.sh installs it alone before the certificate exists.
server {
    listen 80;
    server_name VCHAT_HOST VCHAT_API_HOST;
    include snippets/acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

# Upgrade to a WebSocket when asked; otherwise keep the upstream connection reusable.
map $http_upgrade $vchat_edge_connection {
    default upgrade;
    ""      "";
}

server {
    listen 443 ssl http2;
    server_name VCHAT_HOST VCHAT_API_HOST;
    ssl_certificate     /etc/letsencrypt/live/VCHAT_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VCHAT_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # Chat sockets: long-lived, so long timeouts (clients ping every 25 s).
    location /ws/ {
        proxy_pass http://10.10.11.6:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vchat_edge_connection;
        # Overwritten, never appended: a caller must not be able to choose their address.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://10.10.11.6:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
