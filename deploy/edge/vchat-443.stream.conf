# /etc/nginx/stream.d/vchat-443.conf on 10.10.11.4 (the edge), installed by setup_turn443.sh.
#
# Port 443 is shared by every site here and the vChat TURN relay. This front door reads the
# name the client asked for (TLS SNI) without decrypting anything:
#   TURN_HOST   -> 127.0.0.1:8444, which ends TLS and passes plain TURN to coturn on the app server
#   anything else -> 127.0.0.1:8443, where all the normal https sites now listen
# PROXY protocol carries the visitor's real IP to both, so the sites still see real client IPs.
stream {
    map $ssl_preread_server_name $edge_443_backend {
        TURN_HOST  127.0.0.1:8444;
        default    127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $edge_443_backend;
        proxy_protocol on;
        # Idle limit for one connection (websockets, calls); each side also keeps its own.
        proxy_timeout 1h;
    }

    server {
        listen 127.0.0.1:8444 ssl proxy_protocol;
        ssl_certificate     /etc/letsencrypt/live/CERT_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/CERT_NAME/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass TURN_UPSTREAM;
        proxy_timeout 1h;
    }
}
