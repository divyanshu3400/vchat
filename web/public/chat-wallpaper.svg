  <path d="M130 37h.01M140 37h.01M150 37h.01" stroke-width="3.4"/>
  <!-- heart -->
  <path d="M232 52c-9-6-16-12-16-20a8 8 0 0 1 16-2 8 8 0 0 1 16 2c0 8-7 14-16 20z"/>
  <!-- paper plane -->
  <path d="M30 104l40-16-12 40-9-14zM49 114l9-26"/>
  <!-- star -->
  <path d="M120 92l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/>
  <!-- smiley -->
  <circle cx="214" cy="112" r="16"/>
  <path d="M207 117a10 10 0 0 0 14 0M208 106h.01M220 106h.01" stroke-width="2.6"/>
  <!-- music note -->
  <path d="M40 196v-34l22-6v32"/>
  <circle cx="35" cy="196" r="6"/>
  <circle cx="57" cy="188" r="6"/>
