  <path d="M96 236c-4-3-8-6-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-4 7-8 10z"/>
  <path d="M166 230c6-12 10-12 14 0s10 12 14 0"/>
  <path d="M250 236h.01M84 66h.01M180 76h.01M20 252h.01M250 168h.01" stroke-width="4"/>
